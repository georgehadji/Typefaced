[package]
name = "typefaced-desktop"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Typefaced desktop app: the Tauri shell (driver layer)"

[package.metadata.typefaced]
layer = "driver"

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name, which
# matters on Windows (https://github.com/rust-lang/cargo/issues/8519).
name = "desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.0", features = [] }

[dependencies]
specta = { workspace = true, features = ["function"] }
tauri = { version = "2.12.0", features = [] }
tauri-specta = { version = "=2.0.0-rc.25" }
tf-commands = { path = "../../../crates/tf-commands" }

# The TypeScript exporter is needed only by the `export_bindings` test, so the
# app binary never contains it and cannot export bindings at start-up.
[dev-dependencies]
specta-typescript = "=0.0.12"
tauri-specta = { version = "=2.0.0-rc.25", features = ["typescript"] }

[lints]
workspace = true
