[workspace]
resolver = "3"
# Spikes are separate workspaces (see plans/), so they are not listed here.
members = ["crates/*", "apps/desktop/src-tauri"]

[workspace.package]
edition = "2024"
rust-version = "1.98.1"
license = "LicenseRef-Proprietary"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
# tauri-specta is a release candidate: specta must match its exact version.
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
thiserror = "2"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

# Size settings from the Tauri template. `panic = "abort"` is left out on purpose:
# the panic strategy is decided together with crash handling in a later milestone.
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
