[workspace]
resolver = "3"
# Spikes are separate workspaces (see plans/), so they are not listed here.
members = ["crates/*", "apps/desktop/src-tauri", "xtask"]

[workspace.package]
edition = "2024"
rust-version = "1.98.1"
license = "LicenseRef-Proprietary"
publish = false

[workspace.dependencies]
# Shared versions (M1 Step 1). Members use `name = { workspace = true }` plus their own
# `features`. Pre-1.0 font crates are pinned exactly; upgrade them together (ADR-0006).
imbl = "=7.0.2"
indexmap = "2"
insta = { version = "1.49.0", default-features = false }
kurbo = "=0.13.1"
# Each member chooses its own norad features (tf-compile: `kurbo`). tf-io (M1 Step 9) needs
# `object-libs` to give an object a lib (`replace_lib`); it pulls `uuid` (`v4`), whose
# licence `cargo deny check` must accept in that step.
norad = { version = "=0.18.4", default-features = false }
proptest = "1"
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smallvec = "1"
# tauri-specta is a release candidate: specta must match its exact version.
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
thiserror = "2"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

# Size settings from the Tauri template. `panic = "abort"` is left out on purpose:
# the panic strategy is decided together with crash handling in a later milestone.
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true

# Benchmarks build without LTO so the CI `windows` job stays inside its timeout (M1
# deviation 10). Numbers without LTO are conservative.
[profile.bench]
lto = false
codegen-units = 16
