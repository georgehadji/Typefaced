[package]
name = "tf-boolean"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Boolean engine adapter: the tf-geometry BooleanEngine port on linesweeper"

[package.metadata.typefaced]
layer = "adapter"

[dependencies]
kurbo = "=0.13.1"
# Beta software (R10): pinned. An upgrade reruns the 581 regression cases (ADR-0008).
linesweeper = { workspace = true }
tf-geometry = { path = "../tf-geometry" }

[dev-dependencies]
# The same pin and features as tf-compile, so its resolved features do not change.
norad = { version = "=0.18.4", default-features = false, features = ["kurbo"] }
proptest = "1"

# Plain timing loop; `cargo bench -p tf-boolean`.
[[bench]]
name = "ops"
harness = false

[lints]
workspace = true
