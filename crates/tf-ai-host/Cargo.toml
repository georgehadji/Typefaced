[package]
name = "tf-ai-host"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "AI egress host: the Claude API key in the OS keychain and a streaming proxy that injects it (ADR-0009)"

[package.metadata.typefaced]
layer = "adapter"

[dependencies]
# keyring 4 split the API (keyring-core) from the platform stores (separate crates).
# Without a store keyring-core returns `NoDefaultStore`; the Windows store is below.
keyring-core = "1.0.0"
# reqwest 0.13 defaults to rustls + aws-lc-rs (a cmake/nasm build). The native TLS
# backend uses SChannel and the OS certificate store on Windows.
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls", "http2", "system-proxy"] }
serde = { workspace = true }
serde_json = "1"
specta = { workspace = true }
thiserror = { workspace = true }
tokio = { version = "1.53.1", features = ["macros", "sync"] }

[target.'cfg(windows)'.dependencies]
# Windows Credential Manager. No `search` feature: the vault never enumerates credentials.
windows-native-keyring-store = { version = "1.1.0", default-features = false }

[dev-dependencies]
tokio = { version = "1.53.1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }

[lints]
workspace = true
