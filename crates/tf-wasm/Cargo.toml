[package]
name = "tf-wasm"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "WebAssembly facade over tf-geometry for the UI (built with wasm-pack)"

[package.metadata.typefaced]
layer = "driver"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
tf-geometry = { path = "../tf-geometry" }
# Same version as the one already in Cargo.lock; wasm-pack fetches the matching CLI.
wasm-bindgen = "0.2.129"

# Rust enables these WebAssembly features by default; the wasm-opt that wasm-pack
# downloads rejects them unless they are enabled explicitly.
[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O", "--enable-bulk-memory", "--enable-nontrapping-float-to-int"]

[lints]
workspace = true
