# Pinned font corpus. Nothing here is committed except this manifest:
# `cargo xtask corpus fetch` downloads each entry into `.cache/<name>/` (git-ignored)
# and `cargo xtask corpus verify` re-checks the cache.
#
# Fields:
#   name     directory under .cache/ (lowercase letters, digits and '-')
#   repo     GitHub `owner/name`
#   commit   full 40-character commit SHA; the archive is
#            https://codeload.github.com/<repo>/tar.gz/<commit>
#   path     directory inside the repository; only it is extracted, and its
#            contents land directly in .cache/<name>/
#   license  SPDX expression, checked at the pinned commit; only OFL-1.1,
#            Apache-2.0 and MIT are accepted (see SOURCES.md)
#   digest   SHA-256 over the sorted lines "<relative path>\t<sha256 of file>\n"
#            of the extracted files (paths relative to .cache/<name>/, '/'-separated).
#            It covers the files, not the archive: GitHub keeps archive bytes
#            stable only for a limited time.
#   purpose  why the entry is here

