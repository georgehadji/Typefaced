name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ci-${{ github.ref }}
  # Superseded PR runs are cancelled; every push to main gets a complete run.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The invariants from the M0 plan. The desktop crate needs WebView2 and MSVC.
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: wasm-pack@0.15.0
      # The WASM kernel package must exist before the frontend build and typecheck.
      - run: wasm-pack build crates/tf-wasm --target web --out-dir ../../packages/geometry-wasm/pkg -- --locked
      - run: pnpm --filter @typefaced/desktop build
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Clippy, dev-only bench feature
        run: |
          cargo clippy -p typefaced-desktop --all-targets --features bench --locked -- -D warnings
          cargo test -p typefaced-desktop --features bench --locked bench::
      - run: cargo test --workspace --locked
      - name: Bindings are up to date
        run: git diff --exit-code packages/bindings
      - run: pnpm lint && pnpm typecheck && pnpm test:ci
      - run: cargo xtask check-deps
      - name: No API keys committed
        run: "! git grep -nE 'sk-ant-[A-Za-z0-9_-]{16,}'"
      - name: Tests do not write into the repository
        run: test -z "$(git status --porcelain)" || { git status --porcelain; exit 1; }
      - name: Build the app (debug, no installer)
        if: github.event_name == 'push'
        run: pnpm --filter @typefaced/desktop tauri build --debug --no-bundle

  # License and coverage gates. They never build the desktop crate, so no WebKitGTK.
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          # The same run as local `cargo deny check`: default features only.
          arguments: ""
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: cargo xtask licenses-npm
      - run: cargo xtask context check
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cargo-llvm-cov@0.9.1
      - run: cargo xtask coverage
